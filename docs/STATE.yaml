fixed_constraints:
- runtime_has_no_gold_feedback_or_scorer_access
- separate_agent_and_scorer_compose_projects
- separate_networks_mounts_and_build_contexts
- scorer_network_mode_none
- host_only_one_way_submission_handoff
- fixed_gateway_is_only_model_network_path
- one_session_per_question
- no_example_specific_answer_rules
decisions:
- preserve_original_single_call_path_as_baseline
- use_shared_text_json_action_protocol
- use_structured_question_state_and_raw_jsonl_traces
- use_dev_feedback_dev_holdout_final_hidden_split_policy
- Python 3.12 is used on Ubuntu 24.04; package metadata will support 3.11 and newer.
- The released testmini annotations are development-only and are not represented as
  final hidden evaluation.
- Runtime model requests carry no provider credential; only Model Gateway owns upstream
  authentication.
- Runtime exposes exactly search_report, read_paragraphs, calculator, and submit_answer;
  no generic file or execution skill exists.
- Both Agent and Baseline use the same text JSON submit protocol; native provider
  tool calling is excluded from the primary experiment.
- Sealed archives contain exactly predictions.jsonl, manifest.json, and SHA256SUMS
  and are chmod 0444.
- Docker remains root-controlled in WSL; the development user was not added to the
  docker group.
- Use mirror.gcr.io as the Docker Hub pull-through cache.
- The external .env.agent is sourced only at Gateway launch; secrets are never copied
  into the repository or image.
- The external .env.scorer remains unused because the deterministic scorer is networkless
  and must not hold API credentials.
- Gateway egress is direct by default; host proxy variables are not inherited.
- Use one host flock across Agent, handoff, and Scorer operations.
- Mount only the exact per-run output directory into Agent Runtime.
- Publish a history-free allowlisted Agent release; exclude legacy gold, scorer, outputs,
  and unrestricted inference paths.
- Use run one-e2e-a1-20260814 as the end-to-end gate before the paid full matrix
- Use official FinDVer commit e8bb237def4ce555a606a45edba22666e31df248 test/testmini
  embedding-3-large top-10 outputs; current tasks are covered 700/700.
- Keep formal API configs separate from legacy baseline configs and freeze temperature=1,
  top_p=1, seed=7, max_output_tokens=1024.
- Scope Git safe.directory to the matrix process environment; do not modify global
  Git configuration.
- Treat model JSON formatting failures and max-step exhaustion as experimental invalid
  results; do not retry or tune prompts.
- Freeze formal results to matrix findver-api7-formal-v1, model deepseek-v4-flash,
  and code commit 9a4144fa7059b026f7e444514f403fcca064875d
- Record the public 700-task formal matrix as development evaluation, not a final-hidden
  or leaderboard claim
- Adopt ADR 0002 RAG-seeded budget-aware evidence verification while preserving protocol
  v1 and frozen experiment history.
- Seed evidence is pinned and counts toward evidence and unique-paragraph limits but
  consumes no model, exploration, search, or read budget.
- FixedEmbeddingIndex remains a top-10 compatibility loader; new FixedRetrievalIndex
  validates independent top-3, top-5, and top-10 artifact metadata and SHA256.
- Protocol v1 retains historical max_steps behavior; protocol v2 persists phase budgets
  and rejects incompatible resume.
- Every v2 model attempt is durably charged only to its active phase before the request;
  exhausted exploration always transitions to reserved Finalization.
- Protocol v2 requires bounded control metadata on every action and persists only
  evidence status, confidence, up to five evidence gaps, and enumerated risks.
- Selective Review uses deterministic risk triggers and can replace a draft only with
  a fully valid submission; all review failures fall back to the verified draft.
- Budget-matched iterative RAG uses a fixed seed, a configured invariant count of
  query/search/auto-read rounds, and strict finalization; it has no evidence controller,
  adaptive stop, or review.
- Aggregate model-call totals count requests, while tokens and latency count completed
  responses; state is used only for aggregate tool, evidence, and review totals.
- Private evidence, recovery, paired-bootstrap, and McNemar implementation remains
  outside Runtime; this repository contains only scorer-side contracts because the
  separate scorer repository is absent.
- Iterative RAG uses invariant configured retrieval rounds plus submit-only finalization
  without controller/review; aggregate calls count requests while usage counts responses;
  private evidence analysis remains isolated and blocked on the absent separate scorer
  repository.
- B-class main configs are paired across API and Local with identical generation and
  method settings; backend alias, timeout, retries, and backend kind are the only
  pair differences.
- The two-model planner is preparation-only, requires distinct explicit model IDs,
  creates independent run IDs, and freezes shared task/retrieval hashes and per-condition
  fairness fields.
- Top-k ablations are limited to one primary model on development data; independent
  official top-3 and top-5 artifacts are required before those configs can run.
- B-class API/local pairs share method and generation settings; the planner requires
  distinct explicit model IDs and produces prepared-not-executed paired runs; paid
  and final-hidden execution remains unauthorized.
- The ultra audit was executed exactly once after all implementation phases; no paid
  or hidden experiment ran, no historical artifact changed, and no post-audit implementation
  refactor is required.
- Public release matrix tests use a minimal allowed task fixture while production
  task and retrieval artifact hashes remain pinned.
