run:
  mode: baseline
  backend_kind: local
backend:
  type: openai_compatible
  base_url: http://model-gateway:8080/v1
  model: local-small-model
  timeout_seconds: 180
  max_retries: 2
generation:
  temperature: 0
  top_p: 1
  seed: 7
  max_output_tokens: 1024
  max_context_tokens: 32768
baseline:
  prompt_type: direct
  retrieval: none
  top_k: 10
  concurrency: 1

