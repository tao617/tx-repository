run:
  mode: baseline
  backend_kind: local
backend:
  type: openai_compatible
  base_url: http://model-gateway:8080/v1
  model: local-small-model
  timeout_seconds: 180
  max_retries: 2
  model_context_window_tokens: 100000
  request_profile: generic_openai
generation:
  temperature: 0
  top_p: 1
  seed: 7
  max_output_tokens: 1024
  prompt_budget_tokens: 32768
baseline:
  prompt_type: findver_cot_json
  retrieval: fixed_retrieval
  retrieval_file: /retrieval/findver_embedding3large_top10.json
  retriever: text-embedding-3-large
  top_k: 10
  concurrency: 32
