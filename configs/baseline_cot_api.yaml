run:
  mode: baseline
  backend_kind: api
backend:
  type: openai_compatible
  base_url: http://model-gateway:8080/v1
  model: external-model-name
  timeout_seconds: 120
  max_retries: 3
generation:
  temperature: 0
  top_p: 1
  seed: 7
  max_output_tokens: 1024
  max_context_tokens: 32768
baseline:
  prompt_type: cot
  retrieval: none
  top_k: 10
  concurrency: 32
