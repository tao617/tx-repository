run:
  mode: agent
  backend_kind: local
backend:
  type: openai_compatible
  base_url: http://model-gateway:8080/v1
  model: local-small-model
  timeout_seconds: 180
  max_retries: 2
generation:
  temperature: 0
  top_p: 1
  seed: 7
  max_output_tokens: 1024
  max_context_tokens: 32768
agent:
  max_steps: 8
  max_search_calls: 4
  max_read_calls: 4
  max_calculator_calls: 0
  max_paragraphs_per_read: 12
  max_total_unique_paragraphs: 30
  calculator_enabled: false
  pre_submit_review: false
  cross_question_memory: false
  scorer_feedback: false
  concurrency: 32
