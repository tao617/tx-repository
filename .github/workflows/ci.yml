name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e ".[dev,gateway]"
      - name: Compile and test
        run: |
          python -m compileall -q src scripts tests
          pytest -q
      - name: Validate public entrypoints
        run: |
          bash -n scripts/run_agent_with_env.sh
          bash -n scripts/run_stateful_mock_smoke.sh
          bash -n scripts/run_concurrent_mock_smoke.sh
          bash -n scripts/run_finoasis_mock_smoke.sh
          python scripts/prepare_bclass_matrix.py --help >/dev/null
          python scripts/run_bclass_plan.py --help >/dev/null

  stateful-docker-smoke:
    name: Stateful Docker M2 smoke
    needs: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Runtime verification dependencies
        run: python -m pip install -e .
      - name: Prepare public smoke task
        run: |
          mkdir -p runtime_data/public
          cp tests/fixtures/stateful_smoke_tasks.jsonl \
            runtime_data/public/smoke-tasks.jsonl
          cp tests/fixtures/concurrent_smoke_tasks.jsonl \
            runtime_data/public/concurrent-smoke-tasks.jsonl
          cp tests/fixtures/finoasis_smoke_tasks.jsonl \
            runtime_data/public/finoasis-smoke-tasks.jsonl
      - name: Run no-credential stateful container path
        env:
          GATEWAY_DIAGNOSTICS: "1"
        run: |
          scripts/run_stateful_mock_smoke.sh \
            "ci-stateful-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" 18080
          scripts/run_concurrent_mock_smoke.sh \
            "ci-concurrent-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" 18081
          scripts/run_finoasis_mock_smoke.sh \
            "ci-finoasis-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" 18082
